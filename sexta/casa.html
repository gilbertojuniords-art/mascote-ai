<!doctype html>
<!-- Casa da Sexta-Feira, protótipo de 14/11/2026. Servida pela mascote. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Casa da Sexta-Feira</title>
<style>
  :root { --ciano:#7ff3ff; --azul:#2fb6e8; --ambar:#ffb020; --texto:#e8f7ff; --apagado:#8aa4c0; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body {
    background: radial-gradient(1200px 600px at 30% -10%, #1b2a55 0%, #0b1433 45%, #070d22 100%) fixed;
    color: var(--texto); font: 15px/1.55 "Segoe UI", system-ui, sans-serif;
    overflow-y: auto; scroll-behavior: smooth;
  }
  /* chão quadriculado da casa */
  body::before {
    content:""; position:fixed; inset:auto 0 0 0; height:38vh; pointer-events:none; z-index:0;
    background:
      linear-gradient(to top, rgba(127,243,255,.10), transparent 70%),
      repeating-linear-gradient(90deg, rgba(127,243,255,.07) 0 1px, transparent 1px 48px),
      repeating-linear-gradient(0deg, rgba(127,243,255,.07) 0 1px, transparent 1px 48px);
    mask-image: linear-gradient(to top, black, transparent);
  }
  header { position:sticky; top:0; z-index:3; display:flex; align-items:center; gap:10px;
           padding:10px 22px; background:rgba(7,13,34,.82); backdrop-filter:blur(6px);
           border-bottom:1px solid rgba(127,243,255,.15); font-size:12px; color:var(--apagado); }
  header .luz { width:9px; height:9px; border-radius:50%; background:var(--ciano); box-shadow:0 0 10px var(--ciano); }
  header.falando .luz { animation:pulsa .5s infinite alternate; }
  header.fora .luz { background:#556; box-shadow:none; }
  @keyframes pulsa { to { opacity:.35; } }
  main { position:relative; z-index:1; max-width:780px; margin:0 auto; padding:22px 28px 40vh; }
  h1 { font-size:24px; margin:8px 0 6px; letter-spacing:.2px; }
  .intro { color:var(--apagado); }
  section.sec {
    position:relative; margin:22px 0; padding:16px 20px 12px; border-radius:16px;
    background:linear-gradient(180deg, rgba(27,42,85,.72), rgba(11,20,51,.72));
    border:1px solid rgba(127,243,255,.16); box-shadow:0 8px 30px rgba(0,0,0,.25);
    transition: border-color .4s, box-shadow .4s, opacity .5s, transform .5s, filter .5s;
  }
  section.sec h2 { font-size:17px; margin:0 0 8px; color:var(--ciano); }
  section.sec.atual { border-color:rgba(127,243,255,.7); box-shadow:0 0 0 1px rgba(127,243,255,.35), 0 0 34px rgba(47,182,232,.28); }
  /* em obra: a seção ainda não foi montada pela Sexta */
  section.sec.obra { opacity:.18; filter:blur(3px) saturate(.3); transform:translateY(8px); }
  section.sec.obra::after {
    content:"em obra…"; position:absolute; right:16px; top:14px; font-size:11px; color:var(--ambar);
  }
  /* montando: a linha de luz que passa quando ela "constrói" a seção */
  section.sec.montando::before {
    content:""; position:absolute; left:0; right:0; top:0; height:3px; border-radius:3px;
    background:linear-gradient(90deg, transparent, var(--ciano), transparent);
    box-shadow:0 0 16px var(--ciano); animation:varre 1.1s ease-out forwards;
  }
  @keyframes varre { from { top:0; opacity:1; } to { top:100%; opacity:0; } }
  table { width:100%; border-collapse:collapse; margin:8px 0; font-size:14px; }
  th, td { text-align:left; padding:7px 9px; border-bottom:1px solid rgba(127,243,255,.12); vertical-align:top; }
  th { color:var(--ciano); font-weight:600; background:rgba(127,243,255,.06); }
  code { background:rgba(127,243,255,.12); color:var(--ciano); padding:1px 5px; border-radius:5px; font-size:.92em; }
  b { color:#fff; }
  blockquote { margin:8px 0; padding:6px 12px; border-left:3px solid var(--azul); color:var(--apagado); }
  .fluxo { display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:10px 0; }
  .fluxo .no { padding:8px 11px; border-radius:11px; border:1px solid rgba(127,243,255,.4);
               background:rgba(127,243,255,.07); font-size:13px; text-align:center; }
  .fluxo .seta { color:var(--ciano); font-size:18px; }
  ul, ol { margin:6px 0; padding-left:22px; }
  /* diagramas: o desenho de verdade aparece quando fica pronto; até lá, as caixinhas */
  .diagrama { margin:10px 0; }
  .diagrama pre.mermaid { display:none; }      /* é só o texto do diagrama; o desenho vai na .svgbox */
  .diagrama .svgbox { text-align:center; }
  .diagrama.pronto .reserva { display:none; }
  .diagrama svg { max-width:100%; height:auto; }
  .diagrama svg .node rect, .diagrama svg .node polygon, .diagrama svg .node circle {
    filter: drop-shadow(0 0 6px rgba(127,243,255,.25)); }
</style>
<script src="/mermaid.js"></script>
</head>
<body>
<header id="topo"><span class="luz"></span><span id="aviso">Casa da Sexta-Feira</span></header>
<main>
  <h1 id="titulo"></h1>
  <div class="intro" id="intro"></div>
  <div id="secoes"></div>
</main>
<script>
const $ = s => document.querySelector(s);
if (window.mermaid) {
  mermaid.initialize({ startOnLoad:false, securityLevel:"strict", theme:"base",
    flowchart:{ curve:"basis", htmlLabels:true, padding:12 },
    themeVariables:{ fontFamily:'"Segoe UI", system-ui, sans-serif', fontSize:"14px",
      background:"transparent", primaryColor:"#13224a", primaryTextColor:"#e8f7ff",
      primaryBorderColor:"#7ff3ff", lineColor:"#2fb6e8", secondaryColor:"#1b2a55",
      tertiaryColor:"#0b1433", clusterBkg:"rgba(127,243,255,0.05)", clusterBorder:"#2fb6e8",
      edgeLabelBackground:"#0b1433", titleColor:"#7ff3ff", textColor:"#e8f7ff",
      actorBkg:"#13224a", actorBorder:"#7ff3ff", actorTextColor:"#e8f7ff", noteBkgColor:"#1b2a55",
      noteTextColor:"#e8f7ff", noteBorderColor:"#ffb020" } });
}
async function desenhar() {
  if (!window.mermaid) return;
  // mermaid.render desenha num rascunho visível fora da página (desenhar num elemento escondido
  // deixava o fluxograma vazio, 16x16) e devolve o SVG pronto.
  for (const d of document.querySelectorAll(".diagrama:not(.pronto)")) {
    const codigo = d.querySelector("pre.mermaid").textContent;
    try {
      const { svg } = await mermaid.render("dg" + Date.now() + Math.floor(Math.random() * 1e6), codigo);
      const caixa = document.createElement("div");
      caixa.className = "svgbox"; caixa.innerHTML = svg;
      d.prepend(caixa); d.classList.add("pronto");
    } catch (e) { console.warn("diagrama não desenhou", e); }   // ficam as caixinhas
  }
}
let versao = null, revelado = 999, atual = null, ultimoEnvio = "";

async function pegar(url) { const r = await fetch(url, {cache:"no-store"}); return r.json(); }

async function carregar() {
  const c = await pegar("/conteudo");
  versao = c.v;
  $("#titulo").innerHTML = c.titulo || "";
  $("#intro").innerHTML = c.intro || "";
  $("#secoes").innerHTML = c.secoes.map((s, i) =>
    `<section class="sec" data-i="${i + 1}"><h2>${s.titulo}</h2>${s.html}</section>`).join("");
  aplicar(true);
  desenhar();
}

function aplicar(tudo) {
  document.querySelectorAll("section.sec").forEach(el => {
    const i = +el.dataset.i, estava = el.classList.contains("obra"), fica = i > revelado;
    el.classList.toggle("obra", fica);
    if (estava && !fica && !tudo) {           // acabou de ser montada: passa a luz
      el.classList.remove("montando"); void el.offsetWidth; el.classList.add("montando");
    }
    el.classList.toggle("atual", i === atual);
  });
}

async function ciclo() {
  try {
    const e = await pegar("/estado");
    $("#topo").classList.remove("fora");
    $("#topo").classList.toggle("falando", !!e.fala);
    $("#aviso").textContent = e.revelado < 999 ? "A Sexta está montando…" : "Casa da Sexta-Feira";
    if (e.v !== versao) await carregar();
    const mudouAtual = e.atual !== atual;
    revelado = e.revelado; atual = e.atual;
    aplicar(false);
    if (mudouAtual && atual) {
      const alvo = document.querySelector(`section.sec[data-i="${atual}"]`);
      if (alvo) alvo.scrollIntoView({behavior:"smooth", block:"center"});
    }
  } catch (err) {
    $("#topo").classList.add("fora");
    $("#aviso").textContent = "A Sexta saiu de casa (mascote fechada)";
  }
  // 15/11: rápido só durante uma apresentação; parada, a casa pergunta 2 vezes por segundo
  // (antes eram 8 perguntas por segundo o dia inteiro, mesmo sem nada acontecendo)
  const ativa = revelado < 999 || document.querySelector("#topo.falando");
  setTimeout(ciclo, ativa ? 120 : 500);
}

// Conta para a mascote onde está cada seção (em pixels da página visível).
function medir() {
  const m = $("main").getBoundingClientRect();
  const sec = [...document.querySelectorAll("section.sec")].map(el => {
    const r = el.getBoundingClientRect(), h = el.querySelector("h2").getBoundingClientRect();
    return {y: Math.round(h.top + h.height / 2), x: Math.round(r.left), w: Math.round(r.width),
            top: Math.round(r.top), bottom: Math.round(r.bottom)};
  });
  const d = JSON.stringify({vw: innerWidth, vh: innerHeight, x: Math.round(m.left + 28),
                            w: Math.round(m.width - 56), secoes: sec});
  if (d !== ultimoEnvio) {
    ultimoEnvio = d;
    fetch("/posicoes", {method:"POST", body:d}).catch(() => {});
  }
}
setInterval(() => { ultimoEnvio = ""; }, 1500);  // reenvia de vez em quando (a mascote descarta medidas velhas)
setInterval(medir, 150);
carregar().then(ciclo).catch(ciclo);
</script>
</body>
</html>
